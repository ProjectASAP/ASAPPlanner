# Planner snapshots (#941). Nightly rather than per PR: planning the corpus
# takes minutes on top of a release build.
name: Corpus snapshots

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release build: the corpus queries take minutes in debug. A failure means
  # a plan changed; the regenerated snapshots are uploaded so an intended
  # change can be committed without a local rerun.
  corpus-snapshots:
    runs-on: ubuntu-latest
    # Planning takes 2-6 min (6 min on one core) plus the release build; each
    # query stops at 240 s.
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    # sccache alone: caching the release target as well would duplicate it.
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.4

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Check planner snapshots
      run: cargo test --release --locked -p asap-devtools --test corpus_snapshots -- --include-ignored
      env:
        RUSTC_WRAPPER: sccache

    - name: Upload regenerated snapshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: corpus-snapshots
        path: target/tmp/corpus_snapshots/
        if-no-files-found: ignore
