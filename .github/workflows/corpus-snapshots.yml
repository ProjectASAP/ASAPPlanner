# Planner snapshots (#941). Nightly rather than per PR: planning the corpus
# takes minutes on top of a release build.
name: Corpus snapshots

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release build: the corpus queries take minutes in debug. A failure means
  # a plan changed; the regenerated snapshots are uploaded so an intended
  # change can be committed without a local rerun.
  corpus-snapshots:
    runs-on: ubuntu-latest
    # Planning takes 2-6 min (6 min on one core) plus the release build; each
    # query stops at 240 s.
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    # Caches the registry and compiled dependencies, keyed per job.
    - uses: Swatinem/rust-cache@v2

    - name: Check planner snapshots
      run: cargo test --release --locked -p asap-devtools --test corpus_snapshots -- --include-ignored

    - name: Upload regenerated snapshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: corpus-snapshots
        path: target/tmp/corpus_snapshots/
        if-no-files-found: ignore

    - name: Notify Slack
      if: failure()
      run: |
        curl -sf -X POST -H "Content-type: application/json" \
          -d "{\"text\":\"${SLACK_MENTIONS} ❌ ${GITHUB_REPOSITORY} ${GITHUB_WORKFLOW} failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
          "$SLACK_WEBHOOK_URL"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_MENTIONS: ${{ secrets.SLACK_MENTIONS }}
