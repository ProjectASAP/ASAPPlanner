name: Rust CI

on:
  push:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The promql-parser dependency is a private git repo (ProjectASAP/promql-parser).
  # Cargo must fetch it via the git CLI so it picks up the credential helper
  # configured by the "Authenticate private git deps" step below.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  format-and-lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Grant read access to the private promql-parser mirror. Requires an org/repo
    # secret CARGO_PRIVATE_GIT_TOKEN (fine-grained PAT or GitHub App token with
    # read access to ProjectASAP/promql-parser).
    - name: Authenticate private git deps
      run: |
        git config --global url."https://x-access-token:${{ secrets.CARGO_PRIVATE_GIT_TOKEN }}@github.com/".insteadOf "https://github.com/"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.4

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      env:
        RUSTC_WRAPPER: sccache

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Grant read access to the private promql-parser mirror. Requires an org/repo
    # secret CARGO_PRIVATE_GIT_TOKEN (fine-grained PAT or GitHub App token with
    # read access to ProjectASAP/promql-parser).
    - name: Authenticate private git deps
      run: |
        git config --global url."https://x-access-token:${{ secrets.CARGO_PRIVATE_GIT_TOKEN }}@github.com/".insteadOf "https://github.com/"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.4

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

    - name: Run all workspace tests
      run: cargo test --workspace --locked
      env:
        RUSTC_WRAPPER: sccache
