name: Rust CI

on:
  push:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
      # The devtools viewer_contract test validates the viewer's operator-kind contract.
      - 'tools/dag-viewer/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
      # The devtools viewer_contract test validates the viewer's operator-kind contract.
      - 'tools/dag-viewer/**'
  workflow_dispatch:

concurrency:
  # A delayed draft synchronize event must not cancel ready-for-review tests.
  group: ${{ github.workflow }}-${{ github.ref }}-draft-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format-and-lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    # Caches the registry and compiled dependencies, keyed per job.
    - uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

    # A deployment runtime uses only the facade's and the executor's public
    # APIs. asap-planner's tests check that, but only when the executor links
    # without its `test-support` feature, which a workspace build turns on.
    - name: Check the runtime tests against the public APIs alone
      run: cargo check -p asap-planner --tests --locked

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Free disk space
      # cargo test --workspace links dozens of arrow/datafusion-heavy test
      # binaries; without the preinstalled SDKs we don't need there isn't
      # enough headroom and linking dies with
      # "ld terminated with signal 7 [Bus error]" once it fills up.
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h /

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    # Caches the registry and compiled dependencies, keyed per job.
    - uses: Swatinem/rust-cache@v2

    - name: Run all workspace tests
      run: cargo test --workspace --locked

    # The viewer's Python tests run its JavaScript in V8 through py_mini_racer;
    # the ones that plan a query run target/debug/stage_pipeline, which the
    # workspace test build above already linked for devtools' tests.
    # A pinned Python and Node: the runner's system Python refuses a global
    # pip install (PEP 668).
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Run the DAG viewer's Python tests
      working-directory: tools/dag-viewer
      run: |
        python3 -m pip install py-mini-racer==0.6.0
        python3 -m unittest -v test_viewer test_server

    - name: Run the DAG viewer's Node tests
      run: node --test tools/dag-viewer/stages.test.mjs tools/dag-viewer/enumeration.test.mjs tools/dag-viewer/memo.test.mjs

    - name: Verify MetricsQL frontend as a stable external dependency
      run: bash tools/verify_metricsql_external_consumer.sh

    - name: Verify vendored MetricsQL parser baseline
      run: python3 tools/verify_metricsql_vendored_baseline.py
