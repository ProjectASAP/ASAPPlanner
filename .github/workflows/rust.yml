name: Rust CI

on:
  push:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
      # The devtools viewer_contract test validates the viewer's operator-kind contract.
      - 'tools/dag-viewer/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
      # The devtools viewer_contract test validates the viewer's operator-kind contract.
      - 'tools/dag-viewer/**'
  workflow_dispatch:

concurrency:
  # A delayed draft synchronize event must not cancel ready-for-review tests.
  group: ${{ github.workflow }}-${{ github.ref }}-draft-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format-and-lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.4

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      env:
        RUSTC_WRAPPER: sccache

    # A deployment runtime uses only the facade's and the executor's public
    # APIs. asap-planner's tests check that, but only when the executor links
    # without its `test-support` feature, which a workspace build turns on.
    - name: Check the runtime tests against the public APIs alone
      run: cargo check -p asap-planner --tests --locked
      env:
        RUSTC_WRAPPER: sccache

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Free disk space
      # cargo test --workspace links dozens of arrow/datafusion-heavy test
      # binaries; the runner's ~14GB of free disk (the rest is preinstalled
      # SDKs we don't need) isn't enough headroom and linking dies with
      # "ld terminated with signal 7 [Bus error]" once it fills up.
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h /

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.4

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

    - name: Run all workspace tests
      run: cargo test --workspace --locked
      env:
        RUSTC_WRAPPER: sccache

    # The viewer's Python tests run its JavaScript in V8 through py_mini_racer;
    # the ones that plan a query run target/debug/stage_pipeline, which the
    # workspace test build above already linked for devtools' tests.
    - name: Run the DAG viewer's Python tests
      working-directory: tools/dag-viewer
      run: |
        python3 -m pip install py-mini-racer==0.6.0
        python3 -m unittest -v test_viewer test_server

    - name: Run the DAG viewer's Node tests
      run: node --test tools/dag-viewer/stages.test.mjs

    # A PromQL-only runtime builds asap-planner without DataFusion or MetricsQL.
    - name: Check and test asap-planner with the PromQL frontend alone
      run: |
        cargo check -p asap-planner --no-default-features --features promql --locked
        cargo test -p asap-planner --no-default-features --features promql --locked
      env:
        RUSTC_WRAPPER: sccache

    - name: Verify MetricsQL frontend as a stable external dependency
      run: bash tools/verify_metricsql_external_consumer.sh
      env:
        RUSTC_WRAPPER: sccache

    - name: Verify vendored MetricsQL parser baseline
      run: python3 tools/verify_metricsql_vendored_baseline.py
      env:
        RUSTC_WRAPPER: sccache
