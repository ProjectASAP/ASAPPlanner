[workspace]
members = [
    "crates/executor",
    "crates/types",
    "crates/frontend-common",
    "crates/sql-function-catalog",
    "crates/stage0-memo",
    "crates/stage1-pass1-per-computation-candidates",
    "crates/stage1-pass2-reuse-candidates",
    "crates/stage2-physical-optimization",
    "crates/accuracy",
    "crates/cost",
    "crates/stage3-plan-selection",
    "crates/frontend-promql",
    "crates/frontend-metricsql",
    "crates/metricsql-common-parser-support",
    "crates/frontend-sql",
    "crates/planner",
    "crates/devtools",
    "crates/integration-tests",
]
exclude = ["crates/metricsql-parser-vendored"]
resolver = "2"

[workspace.dependencies]
# The one Arrow version of the workspace (DataFusion in the SQL frontend uses it too).
arrow = { version = "58.4", default-features = false }
# The hasher Arrow already uses, for the executor's hot interning maps.
ahash = { version = "0.8", default-features = false, features = ["std", "runtime-rng"] }
# main after release 0.4.0 (eb04e7f): #245 (checked f64 updates, heap
# rescoring), #246 (KLL lazy-buffer follow-ups), #247 (Count Sketch stack
# medians), #248 (`DdSketch::quantile_interpolated`), #249 (`memory_bytes` and
# `estimated_memory_bytes`; KMV without `experimental`), #251 (the public
# capability table) and #254 (Planner names in that table), plus
# `Kll::shrink_to_fit` from #267 and `DdSketch::shrink_to_fit` from #270
# (branch `planner-pin/dd-kll-shrink-to-fit`: 21b6357, #267's commit, and
# #270's change and tests, since main has renamed the capability
# vocabulary since). Moves to a release once #267 and #270 are in one.
asap_sketchlib = { git = "https://github.com/ProjectASAP/asap_sketchlib", rev = "1cdc3c7726ee172e1e168a44a4f1073915dbdc77" }

[profile.dev]
# Backtraces and profilers keep file:line; full variable info is opt-in via
# CARGO_PROFILE_DEV_DEBUG=2. `profile.test` inherits this.
debug = "line-tables-only"
