[workspace]
members = [
    "crates/types",
    "crates/sql-function-catalog",
    "crates/asap-aware-mapping",
    "crates/frontend-promql",
    "crates/frontend-metricsql",
    "crates/frontend-sql",
    "crates/devtools",
    "crates/integration-tests",
]
resolver = "2"

[patch."https://anonymous@github.com/ccollie/metricsql.git"]
# The upstream parser's shared workspace crate requires nightly and AES CPU
# features for utilities unrelated to parsing. This stable, portable subset
# implements exactly the APIs imported by metricsql_parser.
metricsql_common = { path = "crates/metricsql-common-parser-support" }
