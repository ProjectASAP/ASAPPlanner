[workspace]
members = [
    "crates/asap-physical-operators",
    "crates/types",
    "crates/frontend-common",
    "crates/sql-function-catalog",
    "crates/asap-aware-mapping",
    "crates/logical-optimizer",
    "crates/frontend-promql",
    "crates/frontend-metricsql",
    "crates/metricsql-common-parser-support",
    "crates/frontend-sql",
    "crates/planner",
    "crates/devtools",
    "crates/integration-tests",
]
exclude = ["crates/metricsql-parser-vendored"]
resolver = "2"

[workspace.dependencies]
asap_sketchlib = { git = "https://github.com/ProjectASAP/asap_sketchlib" }
