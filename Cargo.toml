[workspace]
members = [
    "crates/executor",
    "crates/types",
    "crates/frontend-common",
    "crates/sql-function-catalog",
    "crates/stage0-memo",
    "crates/stage1-pass1-per-computation-candidates",
    "crates/stage1-pass2-reuse-candidates",
    "crates/stage2-physical-optimization",
    "crates/accuracy",
    "crates/cost",
    "crates/stage3-plan-selection",
    "crates/frontend-promql",
    "crates/frontend-metricsql",
    "crates/metricsql-common-parser-support",
    "crates/frontend-sql",
    "crates/planner",
    "crates/planner-cli",
    "crates/devtools",
    "crates/integration-tests",
]
exclude = ["crates/metricsql-parser-vendored"]
resolver = "2"

[workspace.dependencies]
# The one Arrow version of the workspace (DataFusion in the SQL frontend uses it too).
arrow = { version = "58.4", default-features = false }
# The hasher Arrow already uses, for the executor's hot interning maps.
ahash = { version = "0.8", default-features = false, features = ["std", "runtime-rng"] }
# main at c5f7866 (through #272): sketch analytics (#262), the full-name
# `SketchAlgorithm` variants (#260), the DDSketch, Bloom, Space-Saving and
# HLL-HIP states without exact side fields (#252, #256-#259), and what the
# executor needs: `Kll::shrink_to_fit` (#267), `DdSketch::shrink_to_fit`
# (#270), the zero-copy sketch views its mapped state columns read (#271),
# DDSketch indexable bounds computed once (#273), and sealed DDSketch stores
# with `u32` counts (#272).
asap_sketchlib = { git = "https://github.com/ProjectASAP/asap_sketchlib", rev = "c5f786637766461532d5ee310436cae8bb61d152" }

[profile.dev]
# Backtraces and profilers keep file:line; full variable info is opt-in via
# CARGO_PROFILE_DEV_DEBUG=2. `profile.test` inherits this.
debug = "line-tables-only"
