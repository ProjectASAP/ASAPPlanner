[workspace]
members = [
    "crates/executor",
    "crates/types",
    "crates/frontend-common",
    "crates/sql-function-catalog",
    "crates/logical-asap-optimization",
    "crates/physical-asap-optimization",
    "crates/cost",
    "crates/plan-selection",
    "crates/frontend-promql",
    "crates/frontend-metricsql",
    "crates/metricsql-common-parser-support",
    "crates/frontend-sql",
    "crates/planner",
    "crates/devtools",
    "crates/integration-tests",
]
exclude = ["crates/metricsql-parser-vendored"]
resolver = "2"

[workspace.dependencies]
# The one Arrow version of the workspace (DataFusion in the SQL frontend uses it too).
arrow = { version = "58.4", default-features = false }
# The hasher Arrow already uses, for the executor's hot interning maps.
ahash = { version = "0.8", default-features = false, features = ["std", "runtime-rng"] }
# main after release 0.4.0 (eb04e7f): #245 (checked f64 updates, heap
# rescoring), #246 (KLL lazy-buffer follow-ups), #247 (Count Sketch stack
# medians), #248 (`DdSketch::quantile_interpolated`), #249 (`memory_bytes` and
# `estimated_memory_bytes`; KMV without `experimental`), #251 (the public
# capability table) and #254 (Planner names in that table). Moves to 0.4.1
# once that is released.
asap_sketchlib = { git = "https://github.com/ProjectASAP/asap_sketchlib", rev = "21b63578c2e612e153f5aaa4d3848f1035a13c60" }
