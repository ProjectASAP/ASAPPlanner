[workspace]
members = [
    "crates/executor",
    "crates/types",
    "crates/frontend-common",
    "crates/sql-function-catalog",
    "crates/logical-asap-optimization",
    "crates/physical-asap-optimization",
    "crates/plan-selection",
    "crates/frontend-promql",
    "crates/frontend-metricsql",
    "crates/metricsql-common-parser-support",
    "crates/frontend-sql",
    "crates/planner",
    "crates/devtools",
    "crates/integration-tests",
]
exclude = ["crates/metricsql-parser-vendored"]
resolver = "2"

[workspace.dependencies]
# The one Arrow version of the workspace (DataFusion in the SQL frontend uses it too).
arrow = { version = "58.4", default-features = false }
# The hasher Arrow already uses, for the executor's hot interning maps.
ahash = { version = "0.8", default-features = false, features = ["std", "runtime-rng"] }
asap_sketchlib = { git = "https://github.com/ProjectASAP/asap_sketchlib", rev = "00f0688070d751399df1195f9a918563e4d8ba74" }
