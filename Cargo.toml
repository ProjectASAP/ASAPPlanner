[workspace]
members = [
    "crates/executor",
    "crates/types",
    "crates/frontend-common",
    "crates/sql-function-catalog",
    "crates/stage0-memo",
    "crates/stage1-pass1-per-computation-candidates",
    "crates/stage1-pass2-reuse-candidates",
    "crates/stage2-physical-optimization",
    "crates/accuracy",
    "crates/cost",
    "crates/stage3-plan-selection",
    "crates/frontend-promql",
    "crates/frontend-metricsql",
    "crates/metricsql-common-parser-support",
    "crates/frontend-sql",
    "crates/planner",
    "crates/planner-cli",
    "crates/devtools",
    "crates/integration-tests",
]
exclude = ["crates/metricsql-parser-vendored"]
resolver = "2"

[workspace.dependencies]
# The one Arrow version of the workspace (DataFusion in the SQL frontend uses it too).
arrow = { version = "58.4", default-features = false }
# The hasher Arrow already uses, for the executor's hot interning maps.
ahash = { version = "0.8", default-features = false, features = ["std", "runtime-rng"] }
# main at a05b35c (through #262: sketch analytics; #260 renamed the
# `SketchAlgorithm` variants to full names with upper-case acronyms; #252,
# #256, #257, #258 and #259 dropped exact side fields from the DDSketch,
# Bloom, Space-Saving and HLL-HIP states and moved them to new ASAPv1 kinds),
# plus three open PRs the executor needs, merged onto that main on branch
# `planner-pin/main-a05b35c-shrink-to-fit`: `Kll::shrink_to_fit` (#267),
# `DdSketch::shrink_to_fit` (#270), and the zero-copy sketch views of #271
# (head 355093f, ported to main's DDSketch without sum/min/max), which the
# executor's mapped state columns read. Moves to main once they merge.
asap_sketchlib = { git = "https://github.com/ProjectASAP/asap_sketchlib", rev = "01f3333cbdc7c55a36642e0938aa7f0040f2cfa8" }

[profile.dev]
# Backtraces and profilers keep file:line; full variable info is opt-in via
# CARGO_PROFILE_DEV_DEBUG=2. `profile.test` inherits this.
debug = "line-tables-only"
