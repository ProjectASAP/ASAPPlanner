[package]
name = "asap-stage1-pass2-reuse-candidates"
version = "0.1.0"
edition = "2021"

# Stage 1, Pass 2: the reuse rules over memo groups and the logical
# edges (`asap_types::stages::LogicalASAPMemoCandidates`) Stage 2 expands.
# Reads Pass 1's memo through `asap_types::stages`; depends on no other
# stage crate.
[dependencies]
asap-types = { path = "../types" }
# The accuracy rules Pass 2 applies: readout levels, the metric rule,
# alpha^log and the deployment's measured accuracy (`AccuracyEvidence`).
asap-accuracy = { path = "../accuracy" }
thiserror = "2"

[dev-dependencies]
asap-types = { path = "../types", features = ["test-support"] }
