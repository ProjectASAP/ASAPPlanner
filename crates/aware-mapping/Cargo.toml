[package]
name = "asap-aware-mapping"
version = "0.1.0"
edition = "2021"

# The cost-aware optimizer layer (L4 decisions) over the L3 intent algebra:
# selects and sizes the summary family for each intent. Consumes and produces
# asap-types (L3 intent algebra + L4 sketch-bound IR) — never depends on a
# front end.
[dependencies]
asap-types = { path = "../types" }
thiserror = "2"
serde_json = "1"
