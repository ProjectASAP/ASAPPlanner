[package]
name = "asap-aware-mapping"
version = "0.1.0"
edition = "2021"

# The planner facade (pass/) over the #509 stage crates: Stage 1
# asap-logical-optimizer and Stage 3 asap-plan-selection (which brings Stage 2).
# Never depends on a front end.
[dependencies]
asap-types = { path = "../types" }
asap-logical-optimizer = { path = "../logical-optimizer" }
asap-plan-selection = { path = "../plan-selection" }
thiserror = "2"

