[package]
name = "asap-physical-asap-optimization"
version = "0.1.0"
edition = "2021"

# #509 Stage 2, physical ASAP-aware optimization: materialization and
# physical operator implementation of each Stage 1 candidate. Depends on
# Stage 1, never on plan selection or the executor.
[dependencies]
asap-types = { path = "../types" }
asap-logical-asap-optimization = { path = "../logical-asap-optimization" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
asap-logical-asap-optimization = { path = "../logical-asap-optimization", features = ["test-support"] }
serde_json = "1"
