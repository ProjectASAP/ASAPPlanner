[package]
name = "asap-physical-asap-optimization"
version = "0.1.0"
edition = "2021"

# #509 Stage 2, physical ASAP-aware optimization: materialization and
# physical operator implementation of each Stage 1 candidate, and the
# PhysicalASAPMemoCandidates Stage 3 selects from (`catalog`). Depends only on
# asap-types (the IR Stage 1 emits) and the shared accuracy model
# (asap-accuracy, guarantee recomposition of a selected plan), never on
# Stage 1's crate, plan selection or the executor. Tests build their inputs
# with Stage 1.
[dependencies]
asap-accuracy = { path = "../accuracy" }
asap-types = { path = "../types" }
# The pane retention of a realized plan (`AssignmentRealizer::realize`).
asap-cost = { path = "../cost" }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
# Exposes `test_support` (single-candidate realization, operator
# implementation, pane coverage) and `catalog::test_support` (catalog
# internals plan selection's unit tests exercise with its solver), for other
# crates' tests.
test-support = []

[dev-dependencies]
asap-types = { path = "../types", features = ["test-support"] }
asap-logical-asap-optimization = { path = "../logical-asap-optimization", features = ["test-support"] }
