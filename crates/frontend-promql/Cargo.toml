[package]
name = "asap-frontend-promql"
version = "0.1.0"
edition = "2021"

# PromQL front end: L1 (parse) → L2 relational, then the shared L2→L3 converter
# — both in asap-types. Pulls the PromQL parser only — never DataFusion.
[dependencies]
asap-types = { path = "../types" }

# Shared ProjectASAP parser contract. Keep this immutable revision aligned
# with backend parsing and treat newly parsed functions as unsupported until
# the frontend lowerer gives them an explicit semantic mapping.
promql-parser = { git = "https://github.com/ProjectASAP/promql-parser", rev = "d7606436bde05efe19c5398fe2122faa49062f7d" }

[dev-dependencies]
asap-aware-mapping = { path = "../asap-aware-mapping" }

# Corpus tests live in domain folders (observability) but must still be declared
# as test targets — Cargo only auto-discovers `.rs` files directly in `tests/`.
[[test]]
name = "awesome_prometheus_alerts"
path = "tests/observability/awesome_prometheus_alerts.rs"

[[test]]
name = "promql_corpus"
path = "tests/observability/promql_corpus.rs"

[[test]]
name = "o11y_bench_promql"
path = "tests/observability/o11y_bench_promql.rs"

[[test]]
name = "metrics_observability"
path = "tests/observability/metrics_observability.rs"
