[package]
name = "asap-frontend-promql"
autotests = false
version = "0.1.0"
edition = "2021"

# PromQL front end: parse → the shared name-based `UnresolvedOp` tree
# (asap-frontend-common) → the unified IR. Pulls the PromQL parser only —
# never DataFusion.
[dependencies]
asap-types = { path = "../types" }
asap-frontend-common = { path = "../frontend-common" }

# Shared ProjectASAP parser contract. Keep this immutable revision aligned
# with backend parsing and treat newly parsed functions as unsupported until
# the frontend lowerer gives them an explicit semantic mapping.
promql-parser = { git = "https://github.com/ProjectASAP/promql-parser", rev = "1d1562e91bbfd59eaceade219a9b98ebb07abdfe" }

[dev-dependencies]
asap-types = { path = "../types", features = ["test-support"] }
asap-accuracy = { path = "../accuracy", features = ["test-support"] }
# Stage 0's memo and Pass 1's target list (`per_computation_candidates`) for the tests.
asap-stage0-memo = { path = "../stage0-memo" }
asap-stage1-pass1-per-computation-candidates = { path = "../stage1-pass1-per-computation-candidates", features = ["test-support"] }
# The planning stages through the facade (a dev-dependency cycle, for
# integration tests only).
asap-planner = { path = "../planner" }

# Corpus tests live in domain folders (observability) but must still be declared
# as test targets — Cargo only auto-discovers `.rs` files directly in `tests/`.
[[test]]
name = "awesome_prometheus_alerts"
path = "tests/observability/awesome_prometheus_alerts.rs"

[[test]]
name = "promql_corpus"
path = "tests/observability/promql_corpus.rs"

[[test]]
name = "o11y_bench_promql"
path = "tests/observability/o11y_bench_promql.rs"

[[test]]
name = "metrics_observability"
path = "tests/observability/metrics_observability.rs"

[[test]]
name = "promql"
path = "tests/main.rs"
