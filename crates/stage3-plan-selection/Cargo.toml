[package]
name = "asap-stage3-plan-selection"
version = "0.1.0"
edition = "2021"

# #509 Stage 3, plan selection: the only stage that costs plans, with the
# planning models (accuracy from `asap-accuracy`; cost from `asap-cost`)
# Reads only Stage 2's output (`asap_types::stages`) and calls Stage 2 through
# the facade's `AssignmentRealizer`: no dependency on Stages 1 or 2, nor on
# the executor (#1054 X1, #1047 P7). Tests build their inputs with them.
[dependencies]
asap-types = { path = "../types" }
asap-accuracy = { path = "../accuracy" }
asap-cost = { path = "../cost" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

good_lp = { version = "=1.15.3", default-features = false, features = ["highs"] }
highs = "=2.4.0"
