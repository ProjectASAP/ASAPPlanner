[package]
name = "asap-stage3-plan-selection"
version = "0.1.0"
edition = "2021"

# Stage 3, plan selection: the only stage that costs plans, with the
# planning models (accuracy from `asap-accuracy`; cost from `asap-cost`).
# Reads only Stage 2's output (`asap_types::stages`) and builds the plan
# itself: no dependency on Stages 1 or 2, nor on the executor.
[dependencies]
asap-types = { path = "../types" }
asap-accuracy = { path = "../accuracy" }
asap-cost = { path = "../cost" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

good_lp = { version = "=1.15.3", default-features = false, features = ["highs"] }
highs = "=2.4.0"

[dev-dependencies]
asap-types = { path = "../types", features = ["test-support"] }
