[package]
name = "asap-frontend-sql"
autotests = false
version = "0.1.0"
edition = "2021"

# SQL front end: L1 (parse + plan via DataFusion) → L2 relational, then the
# shared L2→L3 converter — both in asap-types. Pulls DataFusion, plus the
# independent SQL function-name catalog (asap-sql-function-catalog, issue
# #225) it consults when lowering an aggregate call — never promql-parser.
[dependencies]
asap-types = { path = "../types" }
asap-frontend-common = { path = "../frontend-common" }
asap-sql-function-catalog = { path = "../sql-function-catalog" }
# Planning only: no parquet/compression (never reads data) and no crypto/encoding
# functions (no corpus uses them). `nested_expressions` stays: it provides
# `map(...)` and `col['key']` access used by the o11y corpus.
datafusion = { version = "54", default-features = false, features = [
    "sql",
    "datetime_expressions",
    "string_expressions",
    "unicode_expressions",
    "regex_expressions",
    "nested_expressions",
    "recursive_protection",
] }
# `AggIntent::Extension.payload` for ClickHouse's argMax/argMin (issue #232)
# -- opaque JSON, matching how `asap-types` itself carries it.
serde_json = "1"

[features]
# Exposes `test_support` (lowering to the name-based tree, before binding)
# to tests.
test-support = []

[dev-dependencies]
asap-types = { path = "../types", features = ["test-support"] }
asap-frontend-sql = { path = ".", features = ["test-support"] }
asap-logical-asap-optimization = { path = "../logical-asap-optimization" }
# The planning stages through the facade (a dev-dependency cycle, for
# integration tests only).
asap-planner = { path = "../planner" }
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
# bgp_jan2024_workload corpus is sourced verbatim as YAML (ASAPQuery PR #561)
# rather than transcribed into the flat .sql shape the other corpora use.
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

# Corpus tests in domain folders (data-quality-check, netflow); declared
# explicitly since Cargo only auto-discovers `.rs` files directly in `tests/`.
[[test]]
name = "synthetic_packet_trace"
path = "tests/data_quality_check/synthetic_packet_trace.rs"

[[test]]
name = "tpch_deequ"
path = "tests/data_quality_check/tpch_deequ.rs"

[[test]]
name = "netflow"
path = "tests/netflow/netflow.rs"

[[test]]
name = "bgp_analytics"
path = "tests/bgp_analytics/bgp_analytics.rs"

[[test]]
name = "bgp_jan2024_workload"
path = "tests/bgp_jan2024_workload/bgp_jan2024_workload.rs"

[[test]]
name = "sql"
path = "tests/main.rs"
