[package]
name = "asap-frontend-sql"
version = "0.1.0"
edition = "2021"

# SQL front end: L1 (parse + plan via DataFusion) → L2 relational, then the
# shared L2→L3 converter in asap-ir. Pulls DataFusion only — never promql-parser.
[dependencies]
asap-ir = { path = "../ir" }
asap-l2 = { path = "../l2" }
datafusion = "43"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }

# Corpus tests in domain folders (data-quality-check, netflow); declared
# explicitly since Cargo only auto-discovers `.rs` files directly in `tests/`.
[[test]]
name = "synthetic_packet_trace"
path = "tests/data_quality_check/synthetic_packet_trace.rs"

[[test]]
name = "netflow"
path = "tests/netflow/netflow.rs"

[[test]]
name = "bgp_analytics"
path = "tests/bgp_analytics/bgp_analytics.rs"
