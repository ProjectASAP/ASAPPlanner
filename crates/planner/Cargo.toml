[package]
name = "asap-planner"
autotests = false
version = "0.1.0"
edition = "2021"

# The library facade (issue #429): one entry point that takes prepared input and
# returns the selected DAG. It is the only crate that depends on every
# frontend — before it, the sole facade re-exporting more than one was `asap-devtools`,
# a developer-tools crate. Everything below the frontend boundary lives in the
# stage crates (`asap-stage0-memo`, `asap-stage1-pass1-per-computation-candidates`,
# `asap-stage1-pass2-reuse-candidates`, `asap-stage2-physical-optimization`,
# `asap-stage3-plan-selection`), so a third party writing an optimization pass (issue
# #430) depends on `asap-stage3-plan-selection` (plus `asap-accuracy` to supply its own
# accuracy model or evidence) and never pulls in DataFusion.
[dependencies]
asap-types = { path = "../types" }
asap-cost = { path = "../cost" }
asap-stage3-plan-selection = { path = "../stage3-plan-selection" }
asap-frontend-sql = { path = "../frontend-sql" }
asap-frontend-promql = { path = "../frontend-promql" }
asap-frontend-metricsql = { path = "../frontend-metricsql" }
asap-stage0-memo = { path = "../stage0-memo" }
asap-stage1-pass1-per-computation-candidates = { path = "../stage1-pass1-per-computation-candidates" }
asap-stage1-pass2-reuse-candidates = { path = "../stage1-pass2-reuse-candidates" }
# The facade runs every stage: Stage 2's catalog and realizer, Stage 3's
# `select_plan`, with the deployment's accuracy model.
asap-stage2-physical-optimization = { path = "../stage2-physical-optimization" }
asap-accuracy = { path = "../accuracy" }
# The Planner's own executor: `plan_installable` offers only the summary
# families it runs when the caller leaves them unrestricted.
asap-executor = { path = "../executor" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
asap-stage3-plan-selection = { path = "../stage3-plan-selection" }
asap-stage2-physical-optimization = { path = "../stage2-physical-optimization" }
# The deployment accuracy model tests implement `AccuracyModel`.
asap-accuracy = { path = "../accuracy", features = ["test-support"] }
# The SQL frontend plans through DataFusion, which is async; `e2e_plan` is
# therefore async and its tests need a runtime.
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
# The runtime end-to-end test runs the executor as a runtime does.
futures = "0.3"
# The columnar batch test reads the executor's Arrow columns.
arrow.workspace = true

[[test]]
name = "planner"
path = "tests/main.rs"
