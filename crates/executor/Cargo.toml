[package]
name = "asap-executor"
version = "0.1.0"
edition = "2021"

# #509 Stage 4 reference executor. No stage crate (asap-logical-optimizer,
# asap-physical-optimizer, asap-plan-selection) depends on it; their manifest
# guards reject it. Its tests use the stage crates as dev-dependencies.

[dependencies]
chrono = { version = "=0.4.39", default-features = false, features = ["std"] }
futures = "0.3"
planner-types = { package = "asap-types", path = "../types" }
asap_sketchlib = { git = "https://github.com/ProjectASAP/asap_sketchlib", rev = "5f03ccbd798ed5fec62bdd839bcb331123cab369" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
regex = "1"


[dev-dependencies]
rmp-serde = "1"
asap-plan-selection = { path = "../plan-selection" }
asap-logical-optimizer = { path = "../logical-optimizer" }
asap-frontend-promql = { path = "../frontend-promql" }
