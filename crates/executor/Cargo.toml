[package]
name = "asap-executor"
version = "0.1.0"
edition = "2021"

[dependencies]
arrow.workspace = true
ahash.workspace = true
chrono = { version = "0.4.39", default-features = false, features = ["std"] }
futures = "0.3"
planner-types = { package = "asap-types", path = "../types" }
asap_sketchlib = { workspace = true, features = ["experimental"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
regex = "1"


[features]
# Executor internals the Planner's own tests use (the PromQL row encoding,
# the timing frontier); a deployment runtime does not need them.
test-support = []

[dev-dependencies]
asap-executor = { path = ".", features = ["test-support"] }
rmp-serde = "1"
asap-logical-asap-optimization = { path = "../logical-asap-optimization", features = ["test-support"] }
asap-plan-selection = { path = "../plan-selection" }
asap-frontend-promql = { path = "../frontend-promql" }
