[package]
name = "asap-executor"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.39", default-features = false, features = ["std"] }
futures = "0.3"
planner-types = { package = "asap-types", path = "../types" }
asap_sketchlib = { workspace = true, features = ["experimental"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
regex = "1"


[dev-dependencies]
rmp-serde = "1"
asap-logical-asap-optimization = { path = "../logical-asap-optimization" }
asap-plan-selection = { path = "../plan-selection" }
asap-frontend-promql = { path = "../frontend-promql" }
