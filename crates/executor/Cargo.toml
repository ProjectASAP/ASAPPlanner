[package]
name = "asap-executor"
version = "0.1.0"
edition = "2021"
autotests = false

[dependencies]
arrow.workspace = true
ahash.workspace = true
chrono = { version = "0.4.39", default-features = false, features = ["std"] }
futures = "0.3"
planner-types = { package = "asap-types", path = "../types" }
asap_sketchlib = { workspace = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
regex = "1"


[features]
# Executor internals the Planner's own tests use (the PromQL row encoding,
# the timing frontier); a deployment runtime does not need them.
test-support = []

[dev-dependencies]
asap-executor = { path = ".", features = ["test-support"] }
rmp-serde = "1"
asap-logical-asap-optimization = { path = "../logical-asap-optimization", features = ["test-support"] }
asap-plan-selection = { path = "../plan-selection" }
asap-frontend-promql = { path = "../frontend-promql" }

[[test]]
name = "executor"
path = "tests/main.rs"

# Each installs a counting #[global_allocator] and asserts peak memory, so it
# needs a process of its own.
[[test]]
name = "aggregate_memory_limit"
path = "tests/aggregate_memory_limit.rs"

[[test]]
name = "cheap_measures_memory_limit"
path = "tests/cheap_measures_memory_limit.rs"

[[test]]
name = "grouped_limit_memory_limit"
path = "tests/grouped_limit_memory_limit.rs"

[[test]]
name = "series_window_memory_limit"
path = "tests/series_window_memory_limit.rs"

[[test]]
name = "summary_build_memory_limit"
path = "tests/summary_build_memory_limit.rs"
