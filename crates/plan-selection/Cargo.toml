[package]
name = "asap-plan-selection"
version = "0.1.0"
edition = "2021"

# #509 Stage 3, plan selection: the only stage that prices plans, with the
# planning models (accuracy from `asap-accuracy`; cost from `asap-cost`)
# and the Stage 1 to Stage 3 driver.
# Depends on Stages 1 and 2, never on the executor.
[dependencies]
asap_sketchlib = { workspace = true }
asap-types = { path = "../types" }
asap-accuracy = { path = "../accuracy" }
asap-cost = { path = "../cost" }
asap-logical-asap-optimization = { path = "../logical-asap-optimization" }
asap-physical-asap-optimization = { path = "../physical-asap-optimization" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

good_lp = { version = "=1.15.3", default-features = false, features = ["highs"] }
highs = "=2.4.0"

[dev-dependencies]
asap-types = { path = "../types", features = ["test-support"] }
asap-accuracy = { path = "../accuracy", features = ["test-support"] }
asap-logical-asap-optimization = { path = "../logical-asap-optimization", features = ["test-support"] }
asap-physical-asap-optimization = { path = "../physical-asap-optimization", features = ["test-support"] }
asap-frontend-promql = { path = "../frontend-promql" }
# The executor's charge for each summary state, checked against the bytes
# plan selection prices for it plus the accumulator's own fields (#947).
