[package]
name = "asap-types"
version = "0.1.0"
edition = "2021"

# Shared vocabulary for the whole workspace: the L3 intent algebra (former
# asap-ir) plus the L4 sketch-bound IR types (former asap-sketch, minus its
# execution logic — removed, no real implementor existed; see issue #190).
# No internal deps.
[dependencies]
# "rc" — QueryExpr's child fields are Rc<QueryExpr<C>> (issue #212, #222:
# shared sub-expressions), and Rc<T>'s Serialize/Deserialize impls live behind
# this feature flag. dag_export.rs / DagNode already flatten the tree to a
# node+edge list for JSON export, so this does not change wire format — a
# shared Rc still (de)serializes as an ordinary inline value, once per
# reference, exactly like the old Box.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
