[package]
name = "asap-types"
autotests = false
version = "0.1.0"
edition = "2021"

# Shared vocabulary for the whole workspace: the L3 intent algebra (former
# asap-ir) plus the L4 sketch-bound IR types (former asap-sketch, minus its
# execution logic — removed, no real implementor existed; see issue #190).
# No internal deps.
[dependencies]
# "rc" — OperatorNode child fields are Rc<OperatorNode> (issue #212, #222:
# shared sub-expressions), and Rc<T>'s Serialize/Deserialize impls live behind
# this feature flag. A shared Rc still (de)serializes as an ordinary inline
# value, once per reference, exactly like the old Box.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
# The sketch rows of the family-capability table (`SketchFamily::capability`).
asap_sketchlib = { workspace = true }

[features]
# Exposes the test-only helpers (e.g. `OperatorNode::expect_non_asap`,
# `PhysicalASAPDAG::view_window`) and `test_support` to other crates' tests.
test-support = []

[dev-dependencies]
# The crate's own integration tests use the `test-support` helpers.
asap-types = { path = ".", features = ["test-support"] }

[[test]]
name = "types"
path = "tests/main.rs"
