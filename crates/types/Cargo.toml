[package]
name = "asap-types"
version = "0.1.0"
edition = "2021"

# Shared vocabulary for the whole workspace: the L3 intent algebra (former
# asap-ir) plus the L4 sketch-bound IR types (former asap-sketch, minus its
# execution logic — that lives in asap-aware-mapping::exec). No internal deps.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
