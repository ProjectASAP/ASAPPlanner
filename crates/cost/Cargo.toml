[package]
name = "asap-cost"
version = "0.1.0"
edition = "2021"

# The cost model shared by the planning stages: resource-usage estimation
# (per-operator analytical model, measured operation costs, state byte
# sizes) and the cost models that turn usage into a cost. Depends only on
# `asap-types`, never on a stage crate, so every stage can use it.
[dependencies]
asap_sketchlib = { workspace = true }
asap-types = { path = "../types" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The executor's charge for each summary state, checked against the bytes
# the state byte models give for it plus the accumulator's own fields (#947).
asap-executor = { path = "../executor" }
# Physical plans of PromQL queries for the plan cost tests (tests/), built
# by the stages above this crate; `tests/held_memory.rs` builds them with
# the reference pricer's `optimize_physical_asap`.
asap-logical-asap-optimization = { path = "../logical-asap-optimization", features = ["test-support"] }
asap-physical-asap-optimization = { path = "../physical-asap-optimization", features = ["reference-pricer"] }
