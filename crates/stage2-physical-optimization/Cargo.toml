[package]
name = "asap-stage2-physical-optimization"
version = "0.1.0"
edition = "2021"

# #509 Stage 2, physical ASAP-aware optimization: the physical properties
# (timing, lifetime) of each Stage 1 candidate, the physical edges, and the
# PhysicalASAPMemoCandidates Stage 3 selects from (`catalog`). Depends only on
