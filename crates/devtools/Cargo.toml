[package]
name = "asap-devtools"
autotests = false
version = "0.1.0"
edition = "2021"

# Thin facade over the two front ends — re-exports `lower_promql` / `lower_sql`
# (and batch + lowerer + error types) so a caller can depend on one crate for
# both languages. A caller that needs only one language should depend on the
# matching `asap-frontend-*` crate directly to avoid pulling the other parser.
[dependencies]
asap-frontend-promql = { path = "../frontend-promql" }
asap-frontend-sql = { path = "../frontend-sql" }
asap-accuracy = { path = "../accuracy" }
asap-stage0-memo = { path = "../stage0-memo" }
asap-stage1-pass1-per-computation-candidates = { path = "../stage1-pass1-per-computation-candidates" }
asap-stage1-pass2-reuse-candidates = { path = "../stage1-pass2-reuse-candidates" }
asap-stage2-physical-optimization = { path = "../stage2-physical-optimization" }
asap-cost = { path = "../cost" }
asap-stage3-plan-selection = { path = "../stage3-plan-selection" }
# The installable plan of the selected candidate (`installable_plan_of`),
# whose stored outputs `asap_planner` writes.
asap-planner = { path = "../planner" }
# The executor's supported summary families, which `asap_planner` plans
# with when the deployment declares none, as `plan_installable` does.
asap-executor = { path = "../executor" }

# Used by the asap_planner / variant_coverage bins (catalog schemas,
# async SQL path, JSON output) and by the topk_ir / canonical_examples
# examples. Regular deps, not dev-deps: `[[bin]]` targets can't see dev-deps.
asap-types = { path = "../types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }

[dev-dependencies]
asap-types = { path = "../types", features = ["test-support"] }
asap-stage2-physical-optimization = { path = "../stage2-physical-optimization" }


[[test]]
name = "devtools"
path = "tests/main.rs"

# The nightly corpus-snapshots workflow runs this binary by name.
[[test]]
name = "corpus_snapshots"
path = "tests/corpus_snapshots.rs"
