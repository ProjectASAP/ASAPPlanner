[package]
name = "asap-control-lower"
version = "0.1.0"
edition = "2021"

[dependencies]
asap-control-core = { path = "../core" }
# Private mirror of GreptimeTeam/promql-parser (Apache-2.0). `main` tracks
# upstream untouched; the `asap` branch carries our local grammar/function
# additions (see THIRD_PARTY.md).
promql-parser = { git = "https://github.com/ProjectASAP/promql-parser", branch = "asap" }
# SQL front end: parse + plan via DataFusion, then lower its LogicalPlan to L2.
datafusion = "43"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
