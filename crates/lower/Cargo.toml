[package]
name = "asap-lower"
version = "0.1.0"
edition = "2021"

# Thin facade over the two front ends — re-exports `lower_promql` / `lower_sql`
# (and batch + lowerer + error types) so a caller can depend on one crate for
# both languages. A caller that needs only one language should depend on the
# matching `asap-frontend-*` crate directly to avoid pulling the other parser.
[dependencies]
asap-frontend-promql = { path = "../frontend-promql" }
asap-frontend-sql = { path = "../frontend-sql" }

[dev-dependencies]
# The topk_ir example builds catalog schemas + drives the async SQL path.
asap-ir = { path = "../ir" }
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
