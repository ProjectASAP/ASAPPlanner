[package]
name = "asap-integration-tests"
version = "0.1.0"
edition = "2021"
autotests = false

[dependencies]
asap-types = { path = "../types" }
asap-frontend-promql = { path = "../frontend-promql" }
asap-frontend-sql = { path = "../frontend-sql" }
asap-logical-asap-optimization = { path = "../logical-asap-optimization", features = ["test-support"] }
asap-physical-asap-optimization = { path = "../physical-asap-optimization" }
asap-accuracy = { path = "../accuracy" }
asap-cost = { path = "../cost" }
asap-plan-selection = { path = "../plan-selection" }

[dev-dependencies]
asap-types = { path = "../types", features = ["test-support"] }
asap-accuracy = { path = "../accuracy", features = ["test-support"] }
asap-physical-asap-optimization = { path = "../physical-asap-optimization", features = ["test-support"] }
asap-devtools = { path = "../devtools" }
# The tests plan PromQL and SQL workloads through the facade.
asap-planner = { path = "../planner", features = ["test-support"] }
asap_sketchlib = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }

asap-executor = { path = "../executor", features = ["test-support"] }
futures = "0.3"

[[test]]
name = "integration"
path = "tests/main.rs"
