[package]
name = "asap-integration-tests"
version = "0.1.0"
edition = "2021"
autotests = false

[dependencies]
# The shared fixtures (`src/`) export physical DAGs with test-only helpers.
asap-types = { path = "../types", features = ["test-support"] }
asap-frontend-promql = { path = "../frontend-promql" }
asap-frontend-sql = { path = "../frontend-sql" }
asap-stage0-memo = { path = "../stage0-memo" }
asap-stage1-pass1-per-computation-candidates = { path = "../stage1-pass1-per-computation-candidates" }
asap-stage2-physical-optimization = { path = "../stage2-physical-optimization" }
asap-accuracy = { path = "../accuracy" }
asap-cost = { path = "../cost" }
asap-stage3-plan-selection = { path = "../stage3-plan-selection" }
# The fixtures plan through the facade and the developer tools' reference
# enumeration.
asap-planner = { path = "../planner" }
asap-devtools = { path = "../devtools" }

[dev-dependencies]
asap-types = { path = "../types", features = ["test-support"] }
asap-stage2-physical-optimization = { path = "../stage2-physical-optimization" }
asap-devtools = { path = "../devtools" }
# The tests plan PromQL and SQL workloads through the facade.
asap-planner = { path = "../planner" }
asap_sketchlib = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }

asap-executor = { path = "../executor", features = ["test-support"] }
futures = "0.3"

[[test]]
name = "integration"
path = "tests/main.rs"
