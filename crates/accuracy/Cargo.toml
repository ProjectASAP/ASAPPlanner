[package]
name = "asap-accuracy"
version = "0.1.0"
edition = "2021"

# The accuracy model shared by the planning stages: per-family estimators,
# guarantee composition and propagation through a DAG, sizing, budget
# split, the target check and the
# deployment's accuracy model and evidence traits. Depends only on
# `asap-types`, never on a stage crate, so every stage can use it.
[dependencies]
asap_sketchlib = { workspace = true }
asap-types = { path = "../types" }
serde_json = "1"

[features]
# Exposes `test_support`: estimator, sizing, composition and propagation
# helpers other crates' tests call.
test-support = []

[dev-dependencies]
asap-types = { path = "../types", features = ["test-support"] }
