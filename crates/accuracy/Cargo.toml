[package]
name = "asap-accuracy"
version = "0.1.0"
edition = "2021"

# The accuracy rules shared by the planning stages: per-algorithm
# guarantees (the theoretical guarantee of θ), the target check, the
# deployment's measured accuracy, each operator's error contract and α^log
# of a logical edge. Depends only on `asap-types`, never on a stage crate,
# so every stage can use it.
[dependencies]
asap_sketchlib = { workspace = true }
asap-types = { path = "../types" }
serde_json = "1"

[dev-dependencies]
asap-types = { path = "../types", features = ["test-support"] }
